name: eval

# The eval suite is the spine of this project: every change to the agent,
# its prompts, or the scenario corpus must report an accuracy delta before merge.
on:
  pull_request:
    paths:
      - "agent/**"
      - "prompts/**"
      - "evals/**"
      - ".github/workflows/eval.yml"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scenarios:
        description: 'Scenario ids (comma-separated) or "all"'
        default: "all"
      runs_per_scenario:
        description: "Runs per scenario (higher = tighter CI on a non-deterministic system)"
        default: "3"
      update_baseline:
        description: "Overwrite evals/baseline.json with this run's results"
        type: boolean
        default: false

# A newer push supersedes an in-flight run: model calls cost money and rate limit.
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RCA_MODEL: ${{ vars.RCA_MODEL || 'gemini/gemini-2.0-flash' }}
      RCA_MAX_COST_PER_RUN: ${{ vars.RCA_MAX_COST_PER_RUN || '0.25' }}
      # Free tiers rate-limit aggressively. Serialise by default; raise once measured.
      RCA_CONCURRENCY: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evals/requirements.txt

      - name: Install dependencies
        run: pip install -r evals/requirements.txt

      # Fails in seconds with no cluster and no model spend. A malformed
      # scenario caught here would otherwise surface 40 minutes and several
      # API calls later — or worse, score as a silent pass.
      - name: Validate scenario corpus
        run: python -m evals.validate

      # Hash every input that can change a model's answer. When none of them
      # change, cached responses are replayed and the suite costs nothing.
      - name: Compute prompt fingerprint
        id: fingerprint
        run: |
          FP=$(cat prompts/*.md agent/*.py evals/scenarios/**/*.yaml 2>/dev/null \
               | sha256sum | cut -c1-16)
          echo "value=$FP" >> "$GITHUB_OUTPUT"
          echo "Prompt fingerprint: $FP"

      - name: Restore model-response cache
        uses: actions/cache@v4
        with:
          path: .eval_cache
          key: eval-cache-${{ steps.fingerprint.outputs.value }}-${{ env.RCA_MODEL }}
          # No restore-keys: a partial-prefix hit would replay responses
          # generated by different prompts and silently corrupt the scores.

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: rca-eval
          wait: 120s

      - name: Verify cluster is ready
        run: |
          kubectl cluster-info
          kubectl wait --for=condition=Ready nodes --all --timeout=120s
          kubectl get nodes -o wide

      - name: Run eval suite
        id: run
        run: |
          python -m evals.harness \
            --scenarios "${{ inputs.scenarios || 'all' }}" \
            --runs "${{ inputs.runs_per_scenario || '3' }}" \
            --out eval_results/current.json \
            --cache-dir .eval_cache

      # Always upload: a failed run's partial results are the debugging material.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: eval_results/
          retention-days: 30

      - name: Compare against baseline
        id: compare
        if: always() && hashFiles('eval_results/current.json') != ''
        run: |
          python -m evals.compare \
            --current eval_results/current.json \
            --baseline evals/baseline.json \
            --max-regression 0.05 \
            --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Comment results on PR
        if: always() && github.event_name == 'pull_request' && hashFiles('eval_results/current.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = '<!-- rca-eval -->\n' +
              fs.readFileSync(process.env.GITHUB_STEP_SUMMARY, 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body.includes('<!-- rca-eval -->'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Update baseline
        if: inputs.update_baseline && github.ref == 'refs/heads/main'
        run: |
          cp eval_results/current.json evals/baseline.json
          echo "Baseline updated. Commit evals/baseline.json to record it."
