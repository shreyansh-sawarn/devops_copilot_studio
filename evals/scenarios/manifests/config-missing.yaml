apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-svc
  labels: { app: notification-svc }
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-svc }
  template:
    metadata:
      labels: { app: notification-svc }
    spec:
      containers:
        - name: svc
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          # This ConfigMap is never created: the kubelet cannot build the
          # container's environment, so the container is never started at all.
          envFrom:
            - configMapRef:
                name: notification-config
          resources:
            requests: { memory: "16Mi", cpu: "10m" }
