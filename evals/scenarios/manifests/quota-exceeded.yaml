---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-quota
spec:
  hard:
    requests.memory: "128Mi"
    requests.cpu: "200m"
    pods: "4"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-processor
  labels: { app: batch-processor }
spec:
  replicas: 3
  selector:
    matchLabels: { app: batch-processor }
  template:
    metadata:
      labels: { app: batch-processor }
    spec:
      containers:
        - name: processor
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            # 3 x 256Mi = 768Mi against a 128Mi namespace quota.
            # The ReplicaSet is rejected at admission, so NO pods are ever
            # created — the only evidence lives in ReplicaSet/quota events.
            requests: { memory: "256Mi", cpu: "100m" }
            limits: { memory: "256Mi", cpu: "200m" }
